<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GO GESTÃO - Organograma Profissional</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            .no-print { display: none !important; }
            .canvas-grid { background: white !important; }
            body { background: white !important; }
            .card-shadow { box-shadow: none !important; border: 1px solid #ccc !important; }
        }
        .canvas-grid {
            background-color: #f1f5f9;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 30px 30px;
        }
        .card-shadow {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const defaultData = [
                { 
                    id: '1', title: 'Gerente Geral', person: 'Nome do Gestor', 
                    x: 500, y: 50, color: '#1e40af', parentId: null,
                    activities: ['Gestão de Equipe'],
                    flow: ['Conferência']
                }
            ];

            const [roles, setRoles] = useState(() => {
                const saved = localStorage.getItem('org_data_v3');
                return saved ? JSON.parse(saved) : defaultData;
            });

            const [selectedId, setSelectedId] = useState(null);
            const [dragging, setDragging] = useState(null);
            const [showDetails, setShowDetails] = useState(true);

            useEffect(() => {
                localStorage.setItem('org_data_v3', JSON.stringify(roles));
            }, [roles]);

            const handleMouseDown = (e, id) => {
                if (e.target.closest('.no-drag')) return;
                const role = roles.find(r => r.id === id);
                setSelectedId(id);
                setDragging({
                    id,
                    startX: e.clientX,
                    startY: e.clientY,
                    origX: role.x,
                    origY: role.y
                });
            };

            const handleMouseMove = (e) => {
                if (!dragging) return;
                const dx = e.clientX - dragging.startX;
                const dy = e.clientY - dragging.startY;
                setRoles(prev => prev.map(r => 
                    r.id === dragging.id ? { ...r, x: dragging.origX + dx, y: dragging.origY + dy } : r
                ));
            };

            const handleMouseUp = () => setDragging(null);

            const addRole = () => {
                const newId = Date.now().toString();
                setRoles([...roles, {
                    id: newId, title: 'Nova Função', person: 'Nome',
                    x: 200, y: 200, color: '#64748b', parentId: selectedId || null,
                    activities: [], flow: []
                }]);
                setSelectedId(newId);
            };

            const updateSelected = (field, value) => {
                setRoles(prev => prev.map(r => r.id === selectedId ? { ...r, [field]: value } : r));
            };

            const deleteRole = (id) => {
                if(confirm("Deseja realmente excluir este cargo?")) {
                    setRoles(prev => prev.filter(r => r.id !== id).map(r => r.parentId === id ? { ...r, parentId: null } : r));
                    setSelectedId(null);
                }
            };

            // FUNÇÕES DE ARQUIVO
            const exportToJson = () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(roles));
                const downloadAnchorNode = document.createElement('a');
                downloadAnchorNode.setAttribute("href", dataStr);
                downloadAnchorNode.setAttribute("download", "organograma_gestao.json");
                document.body.appendChild(downloadAnchorNode);
                downloadAnchorNode.click();
                downloadAnchorNode.remove();
            };

            const importFromJson = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const json = JSON.parse(event.target.result);
                        setRoles(json);
                    } catch (err) {
                        alert("Erro ao ler o arquivo.");
                    }
                };
                reader.readAsText(file);
            };

            const clearCanvas = () => {
                if(confirm("Isso apagará todo o quadro atual. Deseja criar um novo?")) {
                    setRoles(defaultData);
                    setSelectedId(null);
                }
            };

            const selectedRole = roles.find(r => r.id === selectedId);

            return (
                <div className="flex h-screen w-full bg-slate-50 overflow-hidden font-sans select-none" onMouseMove={handleMouseMove} onMouseUp={handleMouseUp}>
                    
                    {/* Painel Lateral */}
                    <div className="w-96 bg-white border-r border-slate-200 shadow-2xl z-30 flex flex-col no-print">
                        <div className="p-6 border-b border-slate-100 bg-slate-50/50 flex justify-between items-center">
                            <h1 className="text-xl font-black text-slate-800 flex items-center gap-2 italic">
                                <span className="bg-blue-600 text-white p-1 rounded">GO</span> GESTÃO
                            </h1>
                            <button onClick={clearCanvas} title="Novo Quadro" className="p-2 hover:bg-red-50 text-red-400 rounded-lg transition-colors">
                                🗑️
                            </button>
                        </div>
                        
                        <div className="p-6 flex-1 overflow-y-auto custom-scroll space-y-6">
                            <button onClick={addRole} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg transition-all active:scale-95 flex items-center justify-center gap-2 text-sm uppercase tracking-wider">
                                <span>+</span> Novo Cargo
                            </button>

                            {selectedRole ? (
                                <div className="space-y-5 animate-in fade-in duration-300">
                                    <div className="flex justify-between items-center border-b pb-2">
                                        <h2 className="text-xs font-black text-slate-400 uppercase tracking-widest">Configuração</h2>
                                        <button onClick={() => setSelectedId(null)} className="text-xs text-blue-500 font-bold hover:underline">Fechar</button>
                                    </div>
                                    
                                    <div className="space-y-3">
                                        <label className="block text-[10px] font-bold text-slate-500 uppercase">Informação Básica</label>
                                        <input type="text" value={selectedRole.title} onChange={e => updateSelected('title', e.target.value)} className="w-full p-2.5 bg-slate-50 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500" placeholder="Cargo" />
                                        <input type="text" value={selectedRole.person} onChange={e => updateSelected('person', e.target.value)} className="w-full p-2.5 bg-slate-50 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500" placeholder="Responsável" />
                                    </div>

                                    <div className="space-y-3">
                                        <label className="block text-[10px] font-bold text-slate-500 uppercase">Superior Hierárquico</label>
                                        <select value={selectedRole.parentId || ''} onChange={e => updateSelected('parentId', e.target.value || null)} className="w-full p-2.5 bg-slate-50 border rounded-lg text-sm">
                                            <option value="">Sem Superior</option>
                                            {roles.filter(r => r.id !== selectedId).map(r => <option key={r.id} value={r.id}>{r.title}</option>)}
                                        </select>
                                        <input type="color" value={selectedRole.color} onChange={e => updateSelected('color', e.target.value)} className="w-full h-8 rounded-lg cursor-pointer border-none shadow-sm" />
                                    </div>

                                    <div className="space-y-3">
                                        <label className="block text-[10px] font-bold text-slate-500 uppercase">📌 Atividades</label>
                                        <textarea value={selectedRole.activities?.join('\n') || ''} onChange={e => updateSelected('activities', e.target.value.split('\n'))} className="w-full p-2.5 bg-slate-50 border rounded-lg text-xs h-20 outline-none focus:ring-2 focus:ring-blue-500 no-drag" placeholder="Uma atividade por linha..." />
                                    </div>

                                    <div className="space-y-3">
                                        <label className="block text-[10px] font-bold text-slate-500 uppercase">🔄 Fluxograma</label>
                                        <textarea value={selectedRole.flow?.join('\n') || ''} onChange={e => updateSelected('flow', e.target.value.split('\n'))} className="w-full p-2.5 bg-slate-50 border rounded-lg text-xs h-20 outline-none focus:ring-2 focus:ring-blue-500 no-drag" placeholder="Etapas do fluxo..." />
                                    </div>

                                    <button onClick={() => deleteRole(selectedId)} className="w-full text-red-400 hover:text-red-600 font-bold text-xs py-2 border border-red-100 rounded-lg hover:bg-red-50 transition-colors uppercase tracking-widest">Excluir</button>
                                </div>
                            ) : (
                                <div className="text-center py-10 px-4 bg-slate-50 rounded-2xl border-2 border-dashed border-slate-200">
                                    <p className="text-slate-400 text-xs italic font-medium">Selecione um cartão para editar.</p>
                                </div>
                            )}
                        </div>
                    </div>

                    {/* Área do Quadro */}
                    <div className="flex-1 relative canvas-grid overflow-hidden flex flex-col">
                        
                        {/* Toolbar Superior */}
                        <div className="p-4 flex justify-between items-center z-20 no-print">
                            <div className="flex gap-2">
                                <button onClick={() => setShowDetails(!showDetails)} className={`px-4 py-2 rounded-lg shadow-sm border text-xs font-bold uppercase transition-all ${showDetails ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-slate-600 border-slate-200'}`}>
                                    {showDetails ? '👁️ Detalhes On' : '👁️ Detalhes Off'}
                                </button>
                                <button onClick={() => window.print()} className="bg-white px-4 py-2 rounded-lg shadow-sm border border-slate-200 text-slate-600 text-xs font-bold uppercase hover:bg-slate-50">
                                    🖨️ Imprimir / PDF
                                </button>
                            </div>

                            <div className="flex gap-2 bg-white p-1 rounded-xl shadow-sm border border-slate-200">
                                <label className="cursor-pointer px-4 py-1.5 hover:bg-slate-50 rounded-lg text-xs font-bold text-slate-600 transition-all flex items-center gap-2">
                                    📂 Abrir Modelo
                                    <input type="file" accept=".json" onChange={importFromJson} className="hidden" />
                                </label>
                                <button onClick={exportToJson} className="px-4 py-1.5 bg-slate-800 text-white rounded-lg text-xs font-bold hover:bg-slate-900 transition-all">
                                    💾 Salvar Arquivo
                                </button>
                            </div>
                        </div>

                        {/* Canvas */}
                        <div className="flex-1 relative overflow-auto custom-scroll">
                            <svg className="absolute inset-0 w-full h-full pointer-events-none overflow-visible">
                                <defs>
                                    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                                        <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8" />
                                    </marker>
                                </defs>
                                {roles.map(role => {
                                    if (!role.parentId) return null;
                                    const parent = roles.find(r => r.id === role.parentId);
                                    if (!parent) return null;
                                    const startX = parent.x + 112;
                                    const startY = parent.y + 70;
                                    const endX = role.x + 112;
                                    const endY = role.y;
                                    const midY = (startY + endY) / 2;
                                    return (
                                        <path key={`path-${role.id}`} d={`M ${startX} ${startY} C ${startX} ${midY}, ${endX} ${midY}, ${endX} ${endY}`} fill="none" stroke="#cbd5e1" strokeWidth="2" markerEnd="url(#arrowhead)" />
                                    );
                                })}
                            </svg>

                            {roles.map(role => (
                                <div 
                                    key={role.id} 
                                    onMouseDown={(e) => handleMouseDown(e, role.id)}
                                    style={{ left: role.x, top: role.y, borderTopColor: role.color }}
                                    className={`absolute w-56 bg-white rounded-xl shadow-lg cursor-grab active:cursor-grabbing card-shadow border-t-8 transition-all ${selectedId === role.id ? 'ring-4 ring-blue-400/30 scale-105 z-50' : 'z-10'}`}
                                >
                                    <div className="p-4">
                                        <div className="text-[9px] font-black text-slate-400 uppercase mb-1 truncate">{role.title}</div>
                                        <div className="font-bold text-slate-800 text-sm truncate leading-none mb-2">{role.person}</div>
                                        
                                        {(showDetails && (role.activities?.filter(a => a.trim()).length > 0 || role.flow?.filter(f => f.trim()).length > 0)) && (
                                            <div className="mt-2 pt-2 border-t border-slate-50 space-y-1">
                                                {role.activities?.filter(a => a.trim()).length > 0 && (
                                                    <div className="text-[8px] bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded font-bold uppercase inline-block mr-1">
                                                        📌 {role.activities.filter(a => a.trim()).length} Ativ.
                                                    </div>
                                                )}
                                                {role.flow?.filter(f => f.trim()).length > 0 && (
                                                    <div className="text-[8px] bg-blue-50 text-blue-600 px-1.5 py-0.5 rounded font-bold uppercase inline-block">
                                                        🔄 {role.flow.filter(f => f.trim()).length} Fluxos
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
