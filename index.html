<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GO GESTÃO - Organograma Profissional</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;0,900;1,400&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* ── Reset & Base ─────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body, #root { height: 100%; width: 100%; overflow: hidden; }
        body { font-family: 'DM Sans', sans-serif; background: #f1f5f9; }
        button { font-family: inherit; cursor: pointer; }
        input, select, textarea { font-family: inherit; }
        .mono { font-family: 'DM Mono', monospace; }

        /* ── Layout principal ─────────────────────────── */
        .app {
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            user-select: none;
        }

        /* ── Sidebar ──────────────────────────────────── */
        .sidebar {
            width: 300px;
            flex-shrink: 0;
            background: #fff;
            border-right: 1px solid #e2e8f0;
            box-shadow: 4px 0 24px rgba(0,0,0,0.07);
            z-index: 30;
            display: flex;
            flex-direction: column;
        }
        .sidebar-header {
            padding: 14px 20px;
            background: #1e293b;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .logo {
            font-size: 15px;
            font-weight: 900;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: -0.02em;
            font-style: italic;
        }
        .logo-badge {
            background: #3b82f6;
            color: #fff;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 13px;
        }
        .btn-clear {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 18px;
            padding: 4px;
            border-radius: 6px;
            transition: color 0.15s;
            line-height: 1;
        }
        .btn-clear:hover { color: #f87171; }

        .sidebar-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .sidebar-body::-webkit-scrollbar { width: 4px; }
        .sidebar-body::-webkit-scrollbar-track { background: #f8fafc; }
        .sidebar-body::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        .sidebar-footer {
            padding: 14px 20px;
            border-top: 1px solid #f1f5f9;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
        }
        .footer-row { display: flex; gap: 8px; }

        /* ── Buttons ──────────────────────────────────── */
        .btn-primary {
            background: #1e40af;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 12px;
            padding: 11px 16px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            transition: background 0.15s, transform 0.1s;
        }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-primary:active { transform: scale(0.97); }

        .btn-secondary {
            background: #f8fafc;
            color: #475569;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-weight: 600;
            font-size: 11px;
            padding: 8px 12px;
            flex: 1;
            text-align: center;
            transition: background 0.15s;
            white-space: nowrap;
        }
        .btn-secondary:hover { background: #f1f5f9; }

        .btn-undo {
            width: 100%;
            background: none;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            color: #64748b;
            font-size: 11px;
            font-weight: 600;
            padding: 7px 12px;
            transition: background 0.15s;
        }
        .btn-undo:hover { background: #f8fafc; }

        .btn-delete {
            width: 100%;
            background: none;
            border: 1px solid #fee2e2;
            border-radius: 8px;
            color: #f87171;
            font-size: 11px;
            font-weight: 700;
            padding: 9px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: all 0.15s;
        }
        .btn-delete:hover { background: #fff1f2; color: #dc2626; }

        .btn-details {
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            padding: 8px 14px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            transition: all 0.15s;
            border: 1px solid #e2e8f0;
        }
        .btn-details.on  { background: #2563eb; color: #fff; border-color: #2563eb; }
        .btn-details.off { background: #fff; color: #475569; }
        .btn-details:hover { opacity: 0.85; }

        /* ── Form ─────────────────────────────────────── */
        .field-label {
            display: block;
            font-size: 9px;
            font-weight: 800;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 6px;
        }
        .field-group { display: flex; flex-direction: column; gap: 12px; }
        .field-section { display: flex; flex-direction: column; gap: 6px; }

        .input-text, .input-select {
            width: 100%;
            padding: 9px 11px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 13px;
            color: #1e293b;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .input-text:focus, .input-select:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.12);
        }

        .input-textarea {
            width: 100%;
            padding: 9px 11px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 11px;
            color: #334155;
            outline: none;
            resize: none;
            height: 76px;
            line-height: 1.6;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .input-textarea:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.12);
        }

        .section-divider {
            border: none;
            border-top: 1px solid #f1f5f9;
        }

        .config-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 10px;
        }
        .config-title {
            font-size: 9px;
            font-weight: 800;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        .config-close {
            background: none;
            border: none;
            font-size: 11px;
            font-weight: 700;
            color: #3b82f6;
        }
        .config-close:hover { text-decoration: underline; }

        /* ── Palette ──────────────────────────────────── */
        .palette {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            align-items: center;
        }
        .palette-dot {
            width: 26px; height: 26px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: transform 0.12s;
        }
        .palette-dot:hover { transform: scale(1.15); }
        .palette-dot.active { outline: 2.5px solid #475569; outline-offset: 2px; transform: scale(1.15); }
        .palette-color-input {
            width: 26px; height: 26px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            padding: 0;
            cursor: pointer;
        }

        /* ── Zoom ─────────────────────────────────────── */
        .zoom-section { display: flex; flex-direction: column; gap: 6px; }
        .zoom-label {
            font-size: 9px;
            font-weight: 800;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        input[type=range] { width: 100%; accent-color: #1e40af; }

        /* ── Empty state ──────────────────────────────── */
        .empty-state {
            text-align: center;
            padding: 28px 16px;
            background: #f8fafc;
            border-radius: 12px;
            border: 2px dashed #e2e8f0;
        }
        .empty-state p { color: #94a3b8; font-size: 12px; font-weight: 500; }

        /* ── Canvas ───────────────────────────────────── */
        .canvas-area {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .canvas-grid {
            flex: 1;
            position: relative;
            overflow: hidden;
            background-color: #f1f5f9;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 28px 28px;
        }
        .canvas-world {
            position: absolute;
            width: 4000px;
            height: 4000px;
        }
        .canvas-toolbar {
            position: absolute;
            top: 16px; left: 16px;
            z-index: 20;
        }
        .canvas-hint {
            position: absolute;
            top: 16px; right: 16px;
            z-index: 10;
            background: rgba(255,255,255,0.88);
            backdrop-filter: blur(4px);
            color: #94a3b8;
            font-size: 10px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        /* ── Cards ────────────────────────────────────── */
        .org-card {
            position: absolute;
            width: 220px;
            border-radius: 12px;
            box-shadow: 0 6px 20px -4px rgba(0,0,0,0.15), 0 2px 8px -2px rgba(0,0,0,0.10);
            cursor: grab;
            touch-action: none;
            transition: box-shadow 0.15s;
            z-index: 10;
        }
        .org-card:active { cursor: grabbing; }
        .org-card.selected {
            outline: 3px solid #3b82f6;
            outline-offset: 3px;
            z-index: 50;
            box-shadow: 0 12px 32px -4px rgba(59,130,246,0.3), 0 4px 12px rgba(0,0,0,0.20);
        }
        .card-inner { 
            padding: 14px 14px;
            display: flex;
            flex-direction: column;
            align-items: center; /* Centraliza tudo */
            text-align: center;
        }
        .card-title {
            font-size: 9px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 6px;
        }
        .card-person {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .card-tags {
            margin-top: 10px;
            padding-top: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            width: 100%;
        }
        .tag {
            font-size: 9px;
            font-weight: 800;
            text-transform: uppercase;
            padding: 4px 8px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.15s;
        }
        .tag:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }

        /* ── Toast ────────────────────────────────────── */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            z-index: 9999;
            background: #1e293b;
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            padding: 10px 20px;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.18);
            pointer-events: none;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(16px) translateX(-50%); }
            to   { opacity: 1; transform: translateY(0)    translateX(-50%); }
        }
        @keyframes slideDown {
            from { opacity: 1; transform: translateY(0)    translateX(-50%); }
            to   { opacity: 0; transform: translateY(16px) translateX(-50%); }
        }
        .toast-enter { animation: slideUp   0.28s ease forwards; }
        .toast-exit  { animation: slideDown 0.28s ease forwards; }

        /* ── Print ────────────────────────────────────── */
        @media print {
            .no-print { display: none !important; }
            .canvas-grid { background: white !important; }
            body { background: white !important; }
            .org-card { box-shadow: none !important; border: 1px solid #ccc !important; }
        }
    </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const CARD_W = 220;
const CARD_H = 95;

const PALETTE = [
    '#1e40af','#0369a1','#065f46','#7c3aed',
    '#be185d','#b45309','#dc2626','#475569',
    '#fcd34d','#94a3b8', '#0ea5e9', '#10b981'
];

const DEFAULT_DATA = [
    {
        id: '1', title: 'Gerente Geral', person: 'Nome do Gestor',
        x: 400, y: 80, color: '#1e40af', parentId: null,
        activities: ['Gestão de Equipe', 'Supervisão de Metas'], flow: ['Conferência de Relatórios']
    }
];

/* ── Funções Auxiliares (Cores Inteligentes) ──────────────── */
// Retorna a cor primária de contraste (Branco ou Preto/Escuro)
function getContrastColor(hex) {
    if (!hex) return '#1e293b';
    hex = hex.replace('#', '');
    const r = parseInt(hex.substring(0, 2), 16);
    const g = parseInt(hex.substring(2, 4), 16);
    const b = parseInt(hex.substring(4, 6), 16);
    const yiq = ((r * 299) + (g * 587) + (b * 114)) / 1000;
    return (yiq >= 140) ? '#0f172a' : '#ffffff'; 
}

// Retorna uma cor secundária suave de contraste
function getSubContrastColor(hex) {
    if (!hex) return '#475569';
    hex = hex.replace('#', '');
    const r = parseInt(hex.substring(0, 2), 16);
    const g = parseInt(hex.substring(2, 4), 16);
    const b = parseInt(hex.substring(4, 6), 16);
    const yiq = ((r * 299) + (g * 587) + (b * 114)) / 1000;
    return (yiq >= 140) ? '#475569' : '#cbd5e1'; 
}

/* ── Toast ─────────────────────────────────────── */
function Toast({ message, onDone }) {
    const [exiting, setExiting] = useState(false);
    useEffect(() => {
        const t1 = setTimeout(() => setExiting(true), 1800);
        const t2 = setTimeout(onDone, 2200);
        return () => { clearTimeout(t1); clearTimeout(t2); };
    }, []);
    return <div className={`toast ${exiting ? 'toast-exit' : 'toast-enter'}`}>{message}</div>;
}

/* ── App ───────────────────────────────────────── */
const App = () => {
    const [roles, setRoles] = useState(() => {
        try { const s = localStorage.getItem('org_data_v4'); return s ? JSON.parse(s) : DEFAULT_DATA; }
        catch { return DEFAULT_DATA; }
    });
    const [history,     setHistory]     = useState([]);
    const [selectedId,  setSelectedId]  = useState(null);
    const [showDetails, setShowDetails] = useState(true);
    const [toast,       setToast]       = useState(null);
    const [scale,       setScale]       = useState(1);
    const [pan,         setPan]         = useState({ x: 0, y: 0 });
    const [modalRole,   setModalRole]   = useState(null); // Estado para o modal de atividades

    const dragging  = useRef(null);
    const panning   = useRef(null);
    const canvasRef = useRef(null);

    useEffect(() => { localStorage.setItem('org_data_v4', JSON.stringify(roles)); }, [roles]);

    const showToast  = (msg) => setToast(msg);
    const pushHistory = (prev) => setHistory(h => [...h.slice(-29), prev]);

    /* undo */
    const undo = useCallback(() => {
        if (!history.length) return;
        setRoles(history[history.length - 1]);
        setHistory(h => h.slice(0, -1));
        showToast('↩️ Desfeito');
    }, [history]);
    useEffect(() => {
        const fn = e => { if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); undo(); } };
        window.addEventListener('keydown', fn);
        return () => window.removeEventListener('keydown', fn);
    }, [undo]);

    /* drag card */
    const startDrag = (clientX, clientY, id) => {
        const role = roles.find(r => r.id === id);
        setSelectedId(id);
        dragging.current = { id, startX: clientX, startY: clientY, origX: role.x, origY: role.y };
    };
    const handleMouseDown  = (e, id) => { if (e.target.closest('.no-drag')) return; e.stopPropagation(); startDrag(e.clientX, e.clientY, id); };
    const handleTouchStart = (e, id) => { if (e.target.closest('.no-drag')) return; e.stopPropagation(); startDrag(e.touches[0].clientX, e.touches[0].clientY, id); };

    /* pan */
    const handleCanvasMouseDown = (e) => {
        if (e.button === 1 || e.button === 2) { e.preventDefault(); panning.current = { startX: e.clientX - pan.x, startY: e.clientY - pan.y }; }
        if (e.button === 0 && e.target === canvasRef.current) setSelectedId(null);
    };

    /* move */
    const moveCard = (clientX, clientY) => {
        if (!dragging.current) return;
        const d = dragging.current;
        setRoles(prev => prev.map(r =>
            r.id === d.id ? { ...r, x: d.origX + (clientX - d.startX) / scale, y: d.origY + (clientY - d.startY) / scale } : r
        ));
    };
    const handleMouseMove  = (e) => { moveCard(e.clientX, e.clientY); if (panning.current) setPan({ x: e.clientX - panning.current.startX, y: e.clientY - panning.current.startY }); };
    const handleTouchMove  = (e) => { moveCard(e.touches[0].clientX, e.touches[0].clientY); };
    const handleMouseUp    = () => {
        if (dragging.current) {
            const d = dragging.current;
            const r = roles.find(r => r.id === d.id);
            if (r && (Math.abs(r.x - d.origX) > 2 || Math.abs(r.y - d.origY) > 2))
                pushHistory(roles.map(r => r.id === d.id ? { ...r, x: d.origX, y: d.origY } : r));
        }
        dragging.current = null; panning.current = null;
    };

    /* zoom */
    const handleWheel = (e) => { e.preventDefault(); setScale(s => Math.min(2.5, Math.max(0.25, s * (e.deltaY > 0 ? 0.9 : 1.1)))); };
    useEffect(() => {
        const el = canvasRef.current;
        if (!el) return;
        el.addEventListener('wheel', handleWheel, { passive: false });
        return () => el.removeEventListener('wheel', handleWheel);
    }, []);

    /* CRUD */
    const addRole = () => {
        pushHistory(roles);
        const id = Date.now().toString();
        setRoles(prev => [...prev, {
            id, title: 'Nova Função', person: 'Nome',
            x: 200 + Math.random() * 300, y: 180 + Math.random() * 120,
            color: PALETTE[Math.floor(Math.random() * PALETTE.length)],
            parentId: selectedId || null, activities: [], flow: []
        }]);
        setSelectedId(id);
        showToast('✅ Cargo adicionado');
    };

    const updateSelected = (field, value) =>
        setRoles(prev => prev.map(r => r.id === selectedId ? { ...r, [field]: value } : r));

    const deleteRole = (id) => {
        if (!confirm('Deseja realmente excluir este cargo?')) return;
        pushHistory(roles);
        setRoles(prev => prev.filter(r => r.id !== id).map(r => r.parentId === id ? { ...r, parentId: null } : r));
        setSelectedId(null);
        showToast('🗑️ Cargo removido');
    };

    /* arquivo */
    const exportJson = () => {
        const a = Object.assign(document.createElement('a'), {
            href: URL.createObjectURL(new Blob([JSON.stringify(roles, null, 2)], { type: 'application/json' })),
            download: 'organograma.json'
        });
        a.click();
        showToast('💾 Arquivo salvo');
    };

    const importJson = (e) => {
        const file = e.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = ev => {
            try {
                const json = JSON.parse(ev.target.result);
                if (!Array.isArray(json)) throw new Error('Formato inválido');
                json.forEach(r => { if (!r.id || !r.title) throw new Error('Campo ausente'); });
                pushHistory(roles); setRoles(json); showToast('📂 Modelo carregado');
            } catch (err) { alert('Erro: ' + err.message); }
        };
        reader.readAsText(file); e.target.value = '';
    };

    const clearCanvas = () => {
        if (!confirm('Isso apagará todo o quadro. Deseja continuar?')) return;
        pushHistory(roles); setRoles(DEFAULT_DATA); setSelectedId(null); showToast('🆕 Novo quadro criado');
    };

    const exportPng = async () => {
        showToast('📸 Gerando imagem...');
        try {
            const canvas = await html2canvas(canvasRef.current, { backgroundColor: '#f1f5f9', scale: 2, useCORS: true });
            const a = Object.assign(document.createElement('a'), { href: canvas.toDataURL('image/png'), download: 'organograma.png' });
            a.click(); showToast('✅ Imagem exportada!');
        } catch { alert('Erro ao exportar.'); }
    };

    const sel = roles.find(r => r.id === selectedId);

    return (
        <div className="app"
            onMouseMove={handleMouseMove} onMouseUp={handleMouseUp}
            onTouchMove={handleTouchMove} onTouchEnd={handleMouseUp}
        >
            {/* ══ SIDEBAR ════════════════════════════════ */}
            <aside className="sidebar no-print">
                <div className="sidebar-header">
                    <span className="logo"><span className="logo-badge">GO</span> GESTÃO</span>
                    <button className="btn-clear" onClick={clearCanvas} title="Novo Quadro">🗑️</button>
                </div>

                <div className="sidebar-body">
                    {history.length > 0 && (
                        <button className="btn-undo" onClick={undo}>
                            ↩️ Desfazer &nbsp;<span className="mono" style={{color:'#94a3b8',fontSize:10}}>Ctrl+Z</span>
                        </button>
                    )}

                    <button className="btn-primary" onClick={addRole}>
                        <span style={{fontSize:16,lineHeight:1}}>+</span> Novo Cargo
                    </button>

                    {sel ? (
                        <div className="field-group">
                            <div className="config-header">
                                <span className="config-title">Configurar Cargo</span>
                                <button className="config-close" onClick={() => setSelectedId(null)}>Fechar</button>
                            </div>

                            <div className="field-section">
                                <label className="field-label">Cargo / Responsável</label>
                                <input className="input-text" type="text" value={sel.title}
                                    onChange={e => updateSelected('title', e.target.value)} placeholder="Nome do cargo" />
                                <input className="input-text" type="text" value={sel.person}
                                    onChange={e => updateSelected('person', e.target.value)} placeholder="Responsável" />
                            </div>

                            <div className="field-section">
                                <label className="field-label">Superior Hierárquico</label>
                                <select className="input-select" value={sel.parentId || ''}
                                    onChange={e => updateSelected('parentId', e.target.value || null)}>
                                    <option value="">Sem Superior</option>
                                    {roles.filter(r => r.id !== selectedId).map(r =>
                                        <option key={r.id} value={r.id}>{r.title} — {r.person}</option>
                                    )}
                                </select>
                            </div>

                            <div className="field-section">
                                <label className="field-label">Cor de Fundo do Card</label>
                                <div className="palette">
                                    {PALETTE.map(c => (
                                        <button key={c} className={`palette-dot${sel.color === c ? ' active' : ''}`}
                                            style={{background: c}} onClick={() => updateSelected('color', c)} />
                                    ))}
                                    <input type="color" className="palette-color-input" value={sel.color}
                                        onChange={e => updateSelected('color', e.target.value)} title="Personalizada" />
                                </div>
                            </div>

                            <div className="field-section">
                                <label className="field-label">📌 Atividades</label>
                                <textarea className="input-textarea no-drag"
                                    value={sel.activities?.join('\n') || ''}
                                    onChange={e => updateSelected('activities', e.target.value.split('\n'))}
                                    placeholder="Uma atividade por linha..." />
                            </div>

                            <div className="field-section">
                                <label className="field-label">🔄 Fluxograma</label>
                                <textarea className="input-textarea no-drag"
                                    value={sel.flow?.join('\n') || ''}
                                    onChange={e => updateSelected('flow', e.target.value.split('\n'))}
                                    placeholder="Etapas do fluxo..." />
                            </div>

                            <button className="btn-delete" onClick={() => deleteRole(selectedId)}>Excluir Cargo</button>
                        </div>
                    ) : (
                        <div className="empty-state"><p>Clique em um card para editar</p></div>
                    )}

                    <hr className="section-divider" />

                    <div className="zoom-section">
                        <span className="zoom-label">🔍 Zoom — {Math.round(scale * 100)}%</span>
                        <input type="range" min="25" max="250" value={Math.round(scale * 100)}
                            onChange={e => setScale(e.target.value / 100)} />
                        <button className="btn-secondary" style={{width:'100%'}}
                            onClick={() => { setScale(1); setPan({x:0,y:0}); }}>Resetar Zoom</button>
                    </div>
                </div>

                <div className="sidebar-footer">
                    <div className="footer-row">
                        <button className="btn-secondary" onClick={exportJson}>💾 Salvar JSON</button>
                        <label className="btn-secondary" style={{cursor:'pointer'}}>
                            📂 Abrir JSON
                            <input type="file" accept=".json" onChange={importJson} style={{display:'none'}} />
                        </label>
                    </div>
                    <div className="footer-row">
                        <button className="btn-secondary" onClick={exportPng}>📸 Exportar PNG</button>
                        <button className="btn-secondary" onClick={() => window.print()}>🖨️ Imprimir</button>
                    </div>
                </div>
            </aside>

            {/* ══ CANVAS ════════════════════════════════ */}
            <div className="canvas-area">
                <div className="canvas-toolbar no-print">
                    <button className={`btn-details ${showDetails ? 'on' : 'off'}`}
                        onClick={() => setShowDetails(v => !v)}>
                        {showDetails ? '👁️ Detalhes On' : '👁️ Detalhes Off'}
                    </button>
                </div>
                <div className="canvas-hint no-print">Scroll = zoom · Btn direito = mover</div>

                <div ref={canvasRef} className="canvas-grid"
                    onMouseDown={handleCanvasMouseDown}
                    onContextMenu={e => e.preventDefault()}
                    style={{cursor: panning.current ? 'grabbing' : 'default'}}
                >
                    <div className="canvas-world"
                        style={{transform:`translate(${pan.x}px,${pan.y}px) scale(${scale})`, transformOrigin:'0 0'}}
                    >
                        {/* SVG connections */}
                        <svg style={{position:'absolute',inset:0,width:'100%',height:'100%',overflow:'visible',pointerEvents:'none'}}>
                            <defs>
                                <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
                                    <polygon points="0 0,8 3,0 6" fill="#94a3b8" />
                                </marker>
                            </defs>
                            {roles.map(role => {
                                if (!role.parentId) return null;
                                const p = roles.find(r => r.id === role.parentId);
                                if (!p) return null;
                                const sx = p.x + CARD_W/2, sy = p.y + CARD_H;
                                const ex = role.x + CARD_W/2, ey = role.y;
                                const my = (sy + ey) / 2;
                                return (
                                    <path key={`p-${role.id}`}
                                        d={`M${sx} ${sy} C${sx} ${my},${ex} ${my},${ex} ${ey}`}
                                        fill="none" stroke="#cbd5e1" strokeWidth="2" markerEnd="url(#arr)" />
                                );
                            })}
                        </svg>

                        {/* Cards Atualizados */}
                        {roles.map(role => {
                            const acts  = role.activities?.filter(a => a.trim()) || [];
                            const flows = role.flow?.filter(f => f.trim()) || [];
                            
                            const textColor = getContrastColor(role.color);
                            const subTextColor = getSubContrastColor(role.color);

                            return (
                                <div key={role.id}
                                    className={`org-card${selectedId === role.id ? ' selected' : ''}`}
                                    style={{
                                        left: role.x, 
                                        top: role.y, 
                                        backgroundColor: role.color, 
                                        color: textColor 
                                    }}
                                    onMouseDown={e => handleMouseDown(e, role.id)}
                                    onTouchStart={e => handleTouchStart(e, role.id)}
                                >
                                    <div className="card-inner">
                                        <div className="card-title" style={{ color: subTextColor }}>{role.title}</div>
                                        <div className="card-person">{role.person}</div>
                                        
                                        {showDetails && (acts.length > 0 || flows.length > 0) && (
                                            <div className="card-tags" style={{ borderTop: `1px solid ${subTextColor}55` }}>
                                                {acts.length  > 0 && (
                                                    <button 
                                                        className="tag no-drag" 
                                                        style={{ background: 'rgba(0,0,0,0.15)', color: textColor }}
                                                        onMouseDown={(e) => { e.stopPropagation(); setModalRole(role); }}
                                                        onTouchStart={(e) => { e.stopPropagation(); setModalRole(role); }}
                                                    >
                                                        📌 {acts.length} Ativ.
                                                    </button>
                                                )}
                                                {flows.length > 0 && (
                                                    <button 
                                                        className="tag no-drag" 
                                                        style={{ background: 'rgba(0,0,0,0.15)', color: textColor }}
                                                        onMouseDown={(e) => { e.stopPropagation(); setModalRole(role); }}
                                                        onTouchStart={(e) => { e.stopPropagation(); setModalRole(role); }}
                                                    >
                                                        🔄 {flows.length} Fluxos
                                                    </button>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            </div>

            {/* ── MODAL DE ATIVIDADES ─────────────────────────────── */}
            {modalRole && (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4 no-print" 
                     onClick={() => setModalRole(null)}>
                    <div className="bg-white rounded-2xl shadow-2xl w-[480px] max-w-full max-h-[85vh] flex flex-col overflow-hidden" 
                         onClick={e => e.stopPropagation()}>
                        
                        <div className="p-6 pb-4 border-b border-slate-100" style={{ backgroundColor: modalRole.color, color: getContrastColor(modalRole.color) }}>
                            <h2 className="text-xl font-bold uppercase tracking-tight">{modalRole.title}</h2>
                            <p className="text-sm font-medium opacity-90 mt-1">{modalRole.person}</p>
                        </div>

                        <div className="p-6 overflow-y-auto custom-scroll flex-1 bg-slate-50 space-y-6">
                            {modalRole.activities?.filter(a => a.trim()).length > 0 && (
                                <div>
                                    <h3 className="font-bold text-xs text-slate-400 uppercase tracking-widest mb-3 flex items-center gap-2">
                                        <span className="text-lg">📌</span> Atividades do Cargo
                                    </h3>
                                    <ul className="space-y-2">
                                        {modalRole.activities.filter(a => a.trim()).map((act, i) => (
                                            <li key={i} className="bg-white p-3 rounded-lg border border-slate-200 text-sm text-slate-700 shadow-sm leading-relaxed">
                                                {act}
                                            </li>
                                        ))}
                                    </ul>
                                </div>
                            )}

                            {modalRole.flow?.filter(f => f.trim()).length > 0 && (
                                <div>
                                    <h3 className="font-bold text-xs text-slate-400 uppercase tracking-widest mb-3 flex items-center gap-2">
                                        <span className="text-lg">🔄</span> Fluxograma / Passos
                                    </h3>
                                    <div className="space-y-3 pl-2">
                                        {modalRole.flow.filter(f => f.trim()).map((step, i) => (
                                            <div key={i} className="relative pl-6">
                                                <div className="absolute left-0 top-1.5 w-3 h-3 rounded-full border-2 border-white shadow-sm z-10" style={{ backgroundColor: modalRole.color }}></div>
                                                {i !== modalRole.flow.filter(f => f.trim()).length - 1 && (
                                                    <div className="absolute left-[5px] top-4 bottom-[-16px] w-[2px] bg-slate-200"></div>
                                                )}
                                                <div className="text-sm text-slate-700 font-medium leading-relaxed pb-2">
                                                    {step}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>

                        <div className="p-4 border-t border-slate-100 bg-white">
                            <button onClick={() => setModalRole(null)} className="w-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-3 rounded-xl transition-colors uppercase text-xs tracking-wider">
                                Fechar Visualização
                            </button>
                        </div>
                    </div>
                </div>
            )}

            {toast && <Toast message={toast} onDone={() => setToast(null)} />}
        </div>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
